// thebigsneed autoexec @ 07/31/2026
// crosshair: CSGO-8FSXq-2Ck9S-2M9wk-YpOKF-DQzfF
// display: 7680x2160 @ 240hz
// aspect ratio: 32:9 native
// mouse: x2f
// keyboard: left half of a wireless forager 3x5+2
// contains: knife quickswitch, dynamic xhairs, util buy qol, 180 bind, reload + inspect combo, y-lock w/ hold/release, xhair color cycle, rifles have super follow recoil

// 1080p: cl_crosshairgap -1.5
// 8k2k: cl_crosshairgap -3.5

// mouse motion hook (drives the rifle recoil-xhair swap via fire_step)
bind mouse_x "fire_step; yaw";
bind mouse_y "fire_step; pitch";

// init
alias _ "";
alias "active_xh" "xh_firing;";
alias "resting_fov" "gunplayfov;";
alias "fire_nb" _;
alias "nb_engage" "bind mouse5 _; bind mouse4 _;";
m_yaw 0.022;

// right click -> normal secondary (scope / silencer / burst / knife stab)
bind mouse2 "+attack2";

// fire clock base state + weapon-switch reset
// fire_step is the per-motion clock hook; only the rifle recoil-xhair swap uses it now
alias "fire_step" "_;";
alias "fire_clear" "alias fire_step _; alias rifle_step rifle_step_a; alias fire_engage _; alias fire_disengage _;";

// rifle xhair + followrecoil swap
alias "rifle_step_a" "xh_firing; cl_crosshair_recoil 1; color_change; alias rifle_step rifle_step_b;";
alias "rifle_step_b" "xh_donk_spread; cl_crosshair_recoil 0; color_change; alias rifle_step rifle_step_a;";
alias "rifle_step" "rifle_step_a;";
alias "rifle_engage" "alias fire_step rifle_step;";
alias "rifle_disengage" "alias fire_step _; alias rifle_step rifle_step_a; cl_crosshair_recoil 1;";
alias "fire_engage" _;
alias "fire_disengage" _;

// knife out while held
alias "knife_out" "-attack2; fire_clear; idle_xh; alias active_xh xh_donk_spread; alias fire_nb nb_engage; alias resting_fov inspectfov; inspectfov; slot3;";
alias "gun_out" "-attack2; fire_clear; alias active_xh xh_firing; alias fire_nb nb_engage; alias resting_fov gunplayfov; gunplayfov;";
alias "primary_out" "gun_out; alias fire_engage rifle_engage; alias fire_disengage rifle_disengage;";
alias "secondary_out" "gun_out;";
alias "+quickswitch" "knife_out;";
alias "+quickswitch2" "knife_out;";
alias "-quickswitch" "primary_out; slot1;";
alias "-quickswitch2" "secondary_out; slot2;";

// cycle crosshair colors
alias "color_change" "color_change_a;";
alias "color_change_a" "cl_crosshaircolor 1; alias color_change color_change_b;";
alias "color_change_b" "cl_crosshaircolor_r 255; cl_crosshaircolor_g 128; cl_crosshaircolor_b 224; cl_crosshaircolor 5; alias color_change color_change_c;";
alias "color_change_c" "cl_crosshaircolor_r 0; cl_crosshaircolor_g 255; cl_crosshaircolor_b 255; cl_crosshaircolor 5; alias color_change color_change_d;";
alias "color_change_d" "cl_crosshaircolor_r 255; cl_crosshaircolor_g 255; cl_crosshaircolor_b 0; cl_crosshaircolor 5; alias color_change color_change_e;";
alias "color_change_e" "cl_crosshaircolor_r 255; cl_crosshaircolor_g 128; cl_crosshaircolor_b 0; cl_crosshaircolor 5; alias color_change color_change_a;";

// different xhairs
alias "xh_firing" "cl_crosshairsize 2; cl_crosshair_dynamic_maxdist_splitratio 0; cl_crosshairthickness 1.5; cl_crosshair_dynamic_splitalpha_innermod 0.0; cl_crosshairdot 1; cl_crosshair_t 1;";
alias "xh_donk_spread" "cl_crosshairsize 2; cl_crosshair_dynamic_maxdist_splitratio 0.5; cl_crosshairthickness 1.0; cl_crosshair_dynamic_splitalpha_innermod 1.0; cl_crosshairdot 0; cl_crosshair_t 0;";
alias "xh_ylock" "cl_crosshairsize 0.5; cl_crosshair_dynamic_maxdist_splitratio 0; cl_crosshairthickness 3.0; cl_crosshair_dynamic_splitalpha_innermod 1.0; cl_crosshairdot 0; cl_crosshair_t 0;";

// crosshair routing
alias "fire_xh" "active_xh;";
alias "idle_xh" "xh_donk_spread;";

// xhair color
alias "set_white" "cl_crosshaircolor 5; cl_crosshaircolor_r 255; cl_crosshaircolor_g 255; cl_crosshaircolor_b 255;";
alias "ylock_color" "color_change;";
alias "in_ylock" _;

// fire
alias "+fire" "spec_next; fire_ylock; fire_xh; fire_nb; fire_engage; +attack;";
alias "-fire" "idle_xh; color_change; in_ylock; fire_disengage; bind mouse5 +quickswitch; bind mouse4 +quickswitch2; -attack;";
bind mouse1 "+fire;";

// spin to win (180)
sensitivity 1.3;
alias "oneeighty" "yaw -6293.706293706294 1 1;";
bind q "oneeighty;";

// util aliases/binds
alias "nade_out" "-attack2; fire_clear; alias active_xh xh_donk_spread; alias fire_nb _;";
bind z "buy hegrenade; nade_out; slot6;";
bind x "buy flashbang; nade_out; slot7;";
bind c "buy smokegrenade; nade_out; slot8;";
bind v "buy molotov; buy incgrenade; nade_out; slot10;";

// reload / inspect
alias "inspectfov" "viewmodel_fov 68; viewmodel_offset_x 0; viewmodel_offset_y -2; viewmodel_offset_z 0;";
alias "gunplayfov" "viewmodel_fov 54; viewmodel_offset_x -2; viewmodel_offset_y -2; viewmodel_offset_z -2;";
alias "+relook" "+reload; inspectfov; +lookatweapon;";
alias "-relook" "-reload; resting_fov; -lookatweapon;";
bind r "+relook";

// y-axis lock
alias "ylocktoggle" "ylock_on;";
alias "ylock_on" "sensitivity 0.0013; m_yaw 22.0; alias ylocktoggle ylock_off; alias idle_xh xh_ylock; alias fire_xh _; alias in_ylock ylock_color; ylock_color; xh_ylock;";
alias "ylock_off" "sensitivity 1.3; m_yaw 0.022; alias ylocktoggle ylock_on; alias fire_xh active_xh; alias idle_xh xh_donk_spread; alias in_ylock _; color_change; xh_donk_spread;";
bind mwheeldown "ylocktoggle;";

// fire-unlock behavior toggle
alias "fire_ylock" "ylock_off;";
alias "ylockmode" "ylockmode_hold;";
alias "ylockmode_hold" "alias fire_ylock _; alias ylock_color set_white; alias ylockmode ylockmode_release; set_white;";
alias "ylockmode_release" "alias fire_ylock ylock_off; alias ylock_color color_change; alias ylockmode ylockmode_hold; color_change;";
bind ` "ylockmode;";

// main binds
bind 1 "buy ak47; buy m4a1_silencer; primary_out; slot1;";
bind 2 "buy vesthelm; buy vest; secondary_out; slot2;";
bind 3 "buy defuser; knife_out;";
bind 4 "nade_out; slot4;";
bind 5 "nade_out; slot5;";
bind b "sellbackall;";
bind t "switchhands; resting_fov;";
bind g "drop; primary_out; slot3; slot2; slot1;";
bind mwheelup "nade_out; slot5;";
bind space "+jump;";

// initial state
bind mouse5 +quickswitch;
bind mouse4 +quickswitch2;
secondary_out;
idle_xh;
color_change;
cl_crosshair_recoil 1;
