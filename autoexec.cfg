// thebigsneed autoexec @ 05/04/2026
// crosshair: CSGO-yPDfP-3OLR8-EKz4O-ON2mJ-D3qRP
// display: 7680x2160 @ 240hz
// mouse: x2f
// keyboard: left half of a wireless corne 3x6+2
// contains: sprint binds (knife-while-held), dynamic crosshairs (firing/idle/ylock), util buy qol, 180 bind, reload + inspect combo, y-lock w/ hold/release modes, follow recoil + static crosshair while spraying, xhair color sync

// 1080p: cl_crosshairgap -1.5
// 8k2k: cl_crosshairgap -3.5

// init
alias "active_xh" "xh_firing;";
alias "resting_fov" "gunplayfov;";
alias "fire_nb" "echo;";
alias "nb_engage" "bind mouse5 echo; bind mouse4 echo;";
m_yaw 0.022;

// knife out while held
alias "knife_out" "idle_xh; alias active_xh xh_donk_spread; alias fire_nb nb_engage; alias resting_fov inspectfov; alias weapon_step echo; inspectfov; slot3;";
alias "gun_out" "alias active_xh xh_firing; alias fire_nb nb_engage; alias resting_fov gunplayfov; gunplayfov;";
alias "primary_out"   "gun_out; alias weapon_step ylock_step";
alias "secondary_out" "gun_out; alias weapon_step echo";
alias "+quickswitch" "knife_out;";
alias "+quickswitch2" "knife_out;";
alias "-quickswitch" "primary_out; slot1;";
alias "-quickswitch2" "secondary_out; slot2;";

// cycle crosshair colors
alias "set_yellow"  "cl_crosshaircolor 1";
alias "set_magenta" "cl_crosshaircolor_r 255; cl_crosshaircolor_g 0; cl_crosshaircolor_b 255; cl_crosshaircolor 5;";
alias "set_cyan"    "cl_crosshaircolor_r 0; cl_crosshaircolor_g 255; cl_crosshaircolor_b 255; cl_crosshaircolor 5;";
alias "color_a" "set_yellow";
alias "color_b" "set_magenta";
alias "color_change" "color_change_a;";
alias "color_change_a" "set_yellow;  alias color_a set_yellow;  alias color_b set_magenta; alias color_change color_change_b;";
alias "color_change_b" "set_magenta; alias color_a set_magenta; alias color_b set_cyan;    alias color_change color_change_c;";
alias "color_change_c" "set_cyan;    alias color_a set_cyan;    alias color_b set_yellow;  alias color_change color_change_a;";

// follow recoil + static crosshair
alias "xh_blink"   "xh_blink_a";
alias "xh_blink_a" "xh_donk_spread; cl_crosshair_recoil 0; color_a; alias xh_blink xh_blink_b";
alias "xh_blink_b" "xh_firing;      cl_crosshair_recoil 1; color_b; alias xh_blink xh_blink_a";
alias "xh_step" "echo";

// gates and alias toggles
alias "step_on"     "alias xh_step xh_blink";
alias "mode_step"   "step_on";
alias "ylock_step"  "step_on";
alias "weapon_step" "ylock_step";
bind mouse_x "xh_step; yaw";
bind mouse_y "xh_step; pitch";
bind mouse2 "+attack2";

// different xhairs
alias "xh_firing" "cl_crosshairsize 2;cl_crosshair_dynamic_maxdist_splitratio 0;cl_crosshairthickness 1.5;cl_crosshair_dynamic_splitalpha_innermod 0.0; cl_crosshairdot 1;cl_crosshair_t 1;";
alias "xh_donk_spread" "cl_crosshairsize 2;cl_crosshair_dynamic_maxdist_splitratio 0.5;cl_crosshairthickness 1.0;cl_crosshair_dynamic_splitalpha_innermod 1.0;cl_crosshairdot 0;cl_crosshair_t 0;";
alias "xh_ylock" "cl_crosshairsize 0.5;cl_crosshair_dynamic_maxdist_splitratio 0;cl_crosshairthickness 3.0;cl_crosshair_dynamic_splitalpha_innermod 1.0;cl_crosshairdot 0;cl_crosshair_t 0;";

// crosshair routing — ylock overrides these
alias "fire_xh" "active_xh;";
alias "idle_xh" "xh_donk_spread;";

// xhair color — ylock hold mode turns white
alias "set_white" "cl_crosshaircolor 5; cl_crosshaircolor_r 255; cl_crosshaircolor_g 255; cl_crosshaircolor_b 255;";
alias "ylock_color" "color_change;";
alias "in_ylock" "echo;";

// fire
alias "+fire" "spec_next; fire_ylock; fire_xh; fire_nb; weapon_step; +attack;";
alias "-fire" "idle_xh; color_change; in_ylock; alias xh_step echo; cl_crosshair_recoil 1; bind mouse5 +quickswitch; bind mouse4 +quickswitch2; -attack;";
bind mouse1 "+fire;";

// spin to win (180 + 90)
sensitivity 1.3;
alias "oneeighty" "yaw -6293.706293706294 1 1;";
bind q "oneeighty;";

// util aliases/binds
alias "nade_out" "alias active_xh xh_donk_spread; alias fire_nb echo; alias weapon_step echo;";
bind z "buy hegrenade; nade_out; slot6;";
bind x "buy flashbang; nade_out; slot7;";
bind c "buy smokegrenade; nade_out; slot8;";
bind v "buy molotov; buy incgrenade; nade_out; slot10;";

// reload / inspect
alias "inspectfov" "viewmodel_fov 68; viewmodel_offset_x 0; viewmodel_offset_y -2; viewmodel_offset_z 0;";
alias "gunplayfov" "viewmodel_fov 54; viewmodel_offset_x -2; viewmodel_offset_y -2; viewmodel_offset_z -2;";
alias "+relook" "+reload; inspectfov; +lookatweapon;";
alias "-relook" "-reload; resting_fov; -lookatweapon;";
bind r "+relook";

// y-axis lock
alias "ylocktoggle" "ylock_on;";
alias "ylock_on" "sensitivity 0.0013; m_yaw 22.0; alias ylocktoggle ylock_off; alias idle_xh xh_ylock; alias fire_xh echo; alias in_ylock ylock_color; alias ylock_step mode_step; ylock_color; xh_ylock;";
alias "ylock_off" "sensitivity 1.3; m_yaw 0.022; alias ylocktoggle ylock_on; alias fire_xh active_xh; alias idle_xh xh_donk_spread; alias in_ylock echo; alias ylock_step step_on; color_change; xh_donk_spread;";
bind mwheeldown "ylocktoggle;";

// fire-unlock behavior toggle
alias "fire_ylock" "ylock_off;";
alias "ylockmode" "ylockmode_hold;";
alias "ylockmode_hold" "alias fire_ylock echo; alias ylock_color set_white; alias mode_step echo; alias ylockmode ylockmode_release; set_white;";
alias "ylockmode_release" "alias fire_ylock ylock_off; alias ylock_color color_change; alias mode_step step_on; alias ylockmode ylockmode_hold; color_change;";
bind ` "ylockmode;";

// main binds
bind 1 "buy ak47; buy m4a1_silencer; primary_out; slot1;";
bind 2 "buy vesthelm; buy vest; secondary_out; slot2;";
bind 3 "buy defuser; knife_out;";
bind 4 "nade_out; slot4;";
bind 5 "nade_out; slot5;";
bind b "sellbackall;";
bind t "switchhands; resting_fov;";
bind g "drop; primary_out; slot3; slot2; slot1;";
bind mwheelup "nade_out; slot5;";

// jump
bind space "+jump;";

// follow recoil
cl_crosshair_recoil 1;